description: |
  Kinetis 32.768 kHz RTC oscillator, enabled by RTC_CR[OSCE]. RTC registers
  are only accessible while SIM_SCGC6[RTC] is set, so the driver enables
  access around each RTC_CR access, then restores the previous gate state.

  The oscillator has no ready flag. See
  CONFIG_NXP_KINETIS_RTC_OSC_STARTUP_DELAY.

  Accepts one specifier, which disables the oscillator (when set to 0), or
  enables the oscillator (when set to 1).

compatible: "nxp,kinetis-rtc-osc"

include: [clock-node.yaml]

properties:
  reg:
    required: true
    description: |
      Address and size of the RTC_CR register.

  frequency:
    type: int
    required: true
    description: |
      Frequency of the RTC crystal, in Hz.

  load-capacitance-pf:
    type: int
    default: 0
    description: |
      Internal load capacitance to add to the oscillator, in picofarads.
      Must be an even value from 0 to 30, programmed via RTC_CR[SCxP].

  "#clock-cells":
    const: 1

clock-cells:
  - enable
