description: |
  Kinetis RTC 32 kHz clock output gate, RTC_CR[CLKO]. This gate is active
  low: clearing the bit outputs the RTC oscillator clock to other peripherals.

  Accepts one specifier, which either gates the clock (when set to 0), or
  ungates the clock (when set to 1).

compatible: "nxp,kinetis-rtc-clkout"

include: [clock-node.yaml]

properties:
  input:
    type: phandle
    required: true
    description: |
      phandle to the RTC oscillator.

  reg:
    required: true
    description: |
      Address and size of the RTC_CR register.

  offset:
    type: int
    required: true
    description: |
      Offset of the active low gate bit within RTC_CR.

  "#clock-cells":
    const: 1

clock-cells:
  - gate
